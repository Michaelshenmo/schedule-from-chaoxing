name: Build Test Plugin

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install "class-widgets-sdk>=0.7.0"

      - name: Prepare test version
        id: version
        run: |
          python - <<'PY'
          import json
          import os

          path = "cwplugin.json"
          with open(path, encoding="utf-8") as file:
              manifest = json.load(file)
          short_sha = os.environ["GITHUB_SHA"][:7]
          base_version = manifest["version"].split("-test.", 1)[0]
          manifest["version"] = f"{base_version}-test.{short_sha}"
          with open(path, "w", encoding="utf-8") as file:
              json.dump(manifest, file, ensure_ascii=False, indent=2)
              file.write("\n")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as file:
              file.write(f"plugin_id={manifest['id']}\n")
              file.write(f"plugin_version={manifest['version']}\n")
              file.write(f"short_sha={short_sha}\n")
          print(f"{manifest['id']} {manifest['version']}")
          PY

      - name: Build test packages
        run: |
          mkdir -p dist
          PLUGIN_ID="${{ steps.version.outputs.plugin_id }}"
          SHORT_SHA="${{ steps.version.outputs.short_sha }}"
          cw-plugin-pack . -o "dist/${PLUGIN_ID}-${SHORT_SHA}.cwplugin"
          cw-plugin-pack . --format zip -o "dist/${PLUGIN_ID}-${SHORT_SHA}.zip"
          ls -lh dist

      - name: Write job summary
        run: |
          echo "### Test build" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Plugin: ${{ steps.version.outputs.plugin_id }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version: ${{ steps.version.outputs.plugin_version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.plugin_id }}-${{ steps.version.outputs.short_sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
