[project]
name = "com-msyark-chaoxingsync"
version = "1.2.0"
description = "从超星学习通自动拉取课表并写入独立的 Class Widgets 2 课表"
authors = [
    {name = "Michaelshenmo"},
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "openpyxl>=3.0",
    "ecdsa>=0.19",
]

[project.optional-dependencies]
dev = [
    "class-widgets-sdk>=0.7.0",
    "requests>=2.28",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["chaoxing_sync"]
py-modules = ["main"]
